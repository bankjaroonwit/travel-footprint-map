<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>รอยเท้า</title>
  <meta name="description" content="บันทึกที่เที่ยว ระบายสีจังหวัดและประเทศที่เคยไป จัดทริป สะสมแสตมป์">
  <meta name="theme-color" content="#0f6e56">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="รอยเท้า">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* launch screen: inline so it shows on the very first paint */
    #splash { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 78% 12%, rgba(255,255,255,.12), transparent 42%), linear-gradient(150deg, #22b386, #0a5240);
      color: #fff; font-family: "Noto Sans Thai", system-ui, sans-serif; transition: opacity .45s ease, visibility 0s linear .45s; }
    #splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash.out .sp-logo { transform: scale(1.12); transition: transform .45s ease; }
    .sp-logo { overflow: visible; margin-bottom: 6px; }
    .sp-trail-draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: sp-draw .7s ease-out .1s forwards; }
    .sp-start { transform-origin: 86px 446px; transform: scale(0); animation: sp-pop .35s cubic-bezier(.3,1.6,.5,1) forwards; }
    .sp-pin { transform: translateY(-120px); opacity: 0; filter: drop-shadow(0 10px 12px rgba(3,43,33,.35));
      animation: sp-drop .6s cubic-bezier(.3,1.35,.55,1) .45s forwards; }
    .sp-shadow { transform-origin: 256px 420px; transform: scale(.2); opacity: 0; animation: sp-shadow .6s ease-out .45s forwards; }
    .sp-foot { transform-origin: 256px 230px; transform: scale(1.5); opacity: 0; animation: sp-stamp .3s cubic-bezier(.3,1.5,.5,1) 1s forwards; }
    .sp-name { font-size: 30px; font-weight: 600; letter-spacing: .02em; opacity: 0; transform: translateY(10px); animation: sp-up .45s ease-out 1.05s forwards; }
    .sp-tag { font-size: 14px; opacity: 0; transform: translateY(8px); animation: sp-up2 .45s ease-out 1.2s forwards; }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-pop { to { transform: scale(1); } }
    @keyframes sp-drop { 0% { transform: translateY(-120px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes sp-shadow { to { transform: scale(1); opacity: .3; } }
    @keyframes sp-stamp { to { transform: scale(1); opacity: 1; } }
    @keyframes sp-up { to { opacity: 1; transform: none; } }
    @keyframes sp-up2 { to { opacity: .8; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .2s !important; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg class="sp-logo" viewBox="60 60 392 412" width="168" height="176">
      <defs>
        <linearGradient id="sp-pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6f6ef"/></linearGradient>
        <mask id="sp-trail-mask"><path class="sp-trail-draw" d="M86 446 C 150 430, 168 392, 214 404 S 250 430, 256 418" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/></mask>
      </defs>
      <path d="M86 446 C 150 430, 168 392, 214 404 S 250 430, 256 418" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22" mask="url(#sp-trail-mask)"/>
      <circle class="sp-start" cx="86" cy="446" r="11" fill="#ffd27a"/>
      <ellipse class="sp-shadow" cx="256" cy="420" rx="34" ry="8" fill="#032b21" opacity=".3"/>
      <g class="sp-pin">
        <path d="M256 96c-68 0-122 53-122 119 0 90 122 199 122 199s122-109 122-199c0-66-54-119-122-119z" fill="url(#sp-pin)"/>
        <g class="sp-foot"><g fill="#0f7a5c" transform="rotate(12 256 218)">
          <path d="M256 196c-22 0-34 18-34 42 0 18 6 32 10 46 3 12 2 26 12 34 9 7 25 5 31-6 5-10 2-22 4-34 3-16 13-30 11-50-2-20-14-32-34-32z"/>
          <circle cx="234" cy="174" r="12"/><circle cx="257" cy="164" r="9.5"/><circle cx="276" cy="167" r="8"/><circle cx="291" cy="177" r="7"/><circle cx="300" cy="192" r="6"/>
        </g></g>
      </g>
    </svg>
    <div class="sp-name">รอยเท้า</div>
    <div class="sp-tag">ทุกที่ที่เคยไป</div>
  </div>
  <div id="app">
    <main>
      <section id="view-map" class="view active" aria-label="แผนที่">
        <div id="map"></div>
        <div class="map-top">
          <div class="progress-card">
            <div class="pc-row">
              <div>
                <span class="muted small">ไปแล้ว</span>
                <div class="progress-num"><b id="pc-count">0</b> <span class="muted" id="pc-total">/ 77 จังหวัด</span></div>
              </div>
              <div class="seg" id="mode-seg">
                <button data-action="mode" data-mode="th" class="on">ไทย</button>
                <button data-action="mode" data-mode="world">โลก</button>
              </div>
            </div>
            <div class="bar"><div id="pc-bar" style="width:0%"></div></div>
            <div class="muted small" id="pc-sub">0 ที่</div>
          </div>
          <div class="pick-banner" id="pick-banner" hidden>
            <i class="ti ti-pointer" aria-hidden="true"></i><span id="pick-text"></span>
            <button data-action="cancel-pick">ยกเลิก</button>
          </div>
          <div class="route-chip" id="route-chip" hidden>
            <i class="ti ti-route" aria-hidden="true"></i><span id="route-text"></span>
            <button data-action="clear-route" aria-label="ปิดเส้นทาง"><i class="ti ti-x"></i></button>
          </div>
        </div>
        <div class="map-tools">
          <button class="round-btn" data-action="search" aria-label="ค้นหาสถานที่"><i class="ti ti-search" aria-hidden="true"></i></button>
          <button class="round-btn" data-action="filter" aria-label="ตัวกรอง"><i class="ti ti-filter" aria-hidden="true"></i><span class="dot" id="filter-dot" hidden></span></button>
          <button class="round-btn th-btn" data-action="home-th" aria-label="กลับไปที่ประเทศไทย" title="กลับไปที่ประเทศไทย"><i class="ti ti-home" aria-hidden="true"></i></button>
          <button class="round-btn" data-action="fit-all" aria-label="ดูหมุดทั้งหมด"><i class="ti ti-arrows-maximize" aria-hidden="true"></i></button>
        </div>
        <div class="fabs">
          <button class="fab small" data-action="import-photos" aria-label="ปักหมุดจากรูป"><i class="ti ti-photo-plus" aria-hidden="true"></i></button>
          <button class="fab" data-action="locate" aria-label="ปักหมุดที่ตำแหน่งปัจจุบัน"><i class="ti ti-current-location" aria-hidden="true"></i></button>
        </div>
        <input type="file" id="photo-import" accept="image/*" multiple hidden>
        <div id="hint" class="hint">แตะบนแผนที่เพื่อปักหมุด</div>
      </section>

      <section id="view-journal" class="view" aria-label="ไดอารี่">
        <header class="page-head">
          <h1>ไดอารี่</h1>
          <div class="tools">
            <button class="icon-btn" data-action="new-journal" aria-label="เขียนไดอารี่"><i class="ti ti-pencil" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="page-body" id="journal"></div>
      </section>

      <section id="view-timeline" class="view" aria-label="สถานที่และทริป">
        <header class="page-head"><h1>สถานที่และทริป</h1></header>
        <div class="page-body">
          <div id="tl-seg" style="margin-bottom:12px"></div>
          <div id="timeline"></div>
        </div>
      </section>

      <section id="view-passport" class="view" aria-label="พาสปอร์ต">
        <header class="page-head">
          <h1>พาสปอร์ตของฉัน</h1>
          <div class="tools">
            <button class="icon-btn" data-action="share-card" aria-label="สร้างรูปสรุป"><i class="ti ti-share" aria-hidden="true"></i></button>
            <button class="icon-btn" data-action="settings" aria-label="ตั้งค่า"><i class="ti ti-settings" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="page-body" id="passport"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-action="view" data-view="map"><i class="ti ti-map-2" aria-hidden="true"></i><span>แผนที่</span></button>
      <button class="tab" data-action="view" data-view="timeline"><i class="ti ti-list-details" aria-hidden="true"></i><span>สถานที่</span></button>
      <button class="tab" data-action="view" data-view="journal"><i class="ti ti-notebook" aria-hidden="true"></i><span>ไดอารี่</span></button>
      <button class="tab" data-action="view" data-view="passport"><i class="ti ti-award" aria-hidden="true"></i><span>พาสปอร์ต</span></button>
    </nav>
  </div>

  <div id="sheet-backdrop" data-action="close-sheet"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div id="sheet-body"></div>
  </div>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="ดูรูป" hidden>
    <div class="v-bg" id="viewer-bg"></div>
    <div class="v-track" id="viewer-track"></div>
    <div class="v-top">
      <span id="viewer-count"></span>
      <button class="v-btn" id="viewer-close" data-action="viewer-close" aria-label="ปิด"><i class="ti ti-x"></i></button>
    </div>
    <button class="v-btn" id="viewer-prev" data-action="viewer-prev" aria-label="รูปก่อนหน้า"><i class="ti ti-chevron-left"></i></button>
    <button class="v-btn" id="viewer-next" data-action="viewer-next" aria-label="รูปถัดไป"><i class="ti ti-chevron-right"></i></button>
    <div class="v-bottom">
      <div class="v-cap" id="viewer-cap"></div>
      <div class="v-thumbs" id="viewer-thumbs"></div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/nearby.js"></script>
  <script src="js/views.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/recap.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
